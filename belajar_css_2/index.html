<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>belajar css 2</title>
    <style>
        p.paragraf{
            color: red;
            font-size: 20px;
            background-color: aquamarine;
            margin-top: 5px; /* atur jarak diatasnya */
            padding: 10px; /* atur jarak didalam element */
            border: 1px black; /* memberikan garis border dengan tingkat ketebalan 1px warna hitam*/
        }
        #title-jumbotron{
            color: white;
            background-color: brown;
            padding: 20px;
            border-radius: 10px; /* memberikan efek lengkung pada border dengan radius 10px */
        }

    </style>
</head>
<body>
    <h1 id="title-jumbotron">Selamat datang</h1>
    <h4>Perpustakaan Online</h4>
    
    <p class="paragraf">ini paragraf pertama</p>
    <p class="paragraf">ini paragraf kedua</p>

    <h6 class="paragraf">ini adalah paragraf ketiga</h6>

    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Itaque asperiores optio mollitia labore possimus architecto delectus, quo explicabo vitae reiciendis.</p>
</body>
</html>
